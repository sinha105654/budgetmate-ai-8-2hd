# Runs BudgetMate and its database together.
# Both use the host network, so they can always reach each other.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    network_mode: host
    command: ["mongod", "--bind_ip", "127.0.0.1"]
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    image: budgetmate-ai:${IMAGE_TAG:-latest}
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://127.0.0.1:27017/budgetmate
      PORT: 5000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

volumes:
  mongo-data:
